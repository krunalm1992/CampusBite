services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-campusbite}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-campusbite}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-campusbite} -d ${POSTGRES_DB:-campusbite}"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build: ./backend
    env_file:
      - .env
    environment:
      # The container reaches Postgres by the compose service name, not localhost.
      DATABASE_URL: postgresql://${POSTGRES_USER:-campusbite}:${POSTGRES_PASSWORD:-change-me}@db:5432/${POSTGRES_DB:-campusbite}
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
